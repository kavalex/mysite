name: Bug report
description: Report broken behavior or a regression.
labels: ["bug"]
title: "[bug] "
body:
  - type: markdown
    attributes:
      content: |
        Thanks for the report. Please fill in the fields below.

  - type: input
    id: version
    attributes:
      label: Commit / version
      description: Git commit SHA, release tag, or `git describe` output.
      placeholder: "v0.1.0 or abc1234"
    validations:
      required: true

  - type: input
    id: env
    attributes:
      label: Environment
      description: "OS, Go version (`go version`), SQLite driver version if relevant."
      placeholder: "macOS 14.5, go1.27.2"
    validations:
      required: true

  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      description: Minimal commands / URLs to trigger the bug.
      render: shell
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Relevant logs / output
      render: shell
      description: Paste `server.log` excerpts or `curl -v` output, redact secrets.

  - type: checkboxes
    id: checklist
    attributes:
      label: Pre-flight
      options:
        - label: I searched existing issues
          required: true
        - label: I read [CONTRIBUTING.md](../../CONTRIBUTING.md) and [SECURITY.md](../../SECURITY.md)
          required: true
        - label: This is NOT a security vulnerability (use SECURITY.md for those)
          required: true
